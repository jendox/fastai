[project]
name = "fastai"
version = "0.1.0"
description = """
FastAI is an AI-powered website generator built with FastAPI.
It automates website creation using OpenAI, integrates with cloud storage,
and provides a scalable backend for dynamic content generation.
Perfect for learning FastAPI, AI APIs, and cloud deployment.
"""
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "aioboto3>=15.1.0",
    "editorconfig-checker==3.2.1",
    "fastapi[standard]==0.115.12",
    "html-page-generator",
    "pre-commit>=4.2.0",
    "pydantic-settings>=2.10.1",
    "ruff==0.11.13",
]

[tool.uv.sources]
html-page-generator = { git = "https://github.com/devmanorg/html-page-generator.git" }
